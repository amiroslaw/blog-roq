items:
  - title: "Shopping List"
    caption: "Aplikacja zakupowa"
    image: "portfolio/shopping.png"
    type: "modal"
    description: "This web application helps to create meal plans, find recipes based on that meal, and organize grocery lists around those recipes and what you have in your fridge."
    features:
      - "Separation between backend and frontend"
      - "Creating a grocery list"
      - "Managing purchased ingredients"
      - "Create the recipes and share them with others"
      - "Finding a recipe that you can make from your purchased ingredients"
      - "User authentication"
    technology: "Spring Boot (Spring MVC, Spring Security - JWT), Java 11, Hibernate, JUnit, Mockito, JHipster, Angular"
    repository: "https://github.com/amiroslaw/shopping-list-angular"

  - title: "TimeFx"
    caption: "Aplikacja do prezentowania wykresów z TimeWarrior"
    image: "portfolio/timefx.png"
    type: "modal"
    description: "GUI application for presenting Timewarrior data on charts."
    features:
      - "Pie and area chart"
      - "Filtering by context or project"
      - "Simple statistics"
    technology: "Java Native Image, JavaFX, Java 17"
    repository: "https://github.com/amiroslaw/timeFX"

  - title: "Kindle2Anki"
    caption: "Konwerter ułatwiający tworzenie flashcards dla programu Anki"
    image: "portfolio/anki.png"
    type: "modal"
    description: "Kindle Vocabulary to anki flashcards converter."
    features:
      - "Export kindle vocabulary to a TSV file."
      - "Fetch informations from a dictionary"
      - "User database"
      - "Import words from a TSV file"
    technology: "Spring Shell, Java 21"
    repository: "https://github.com/amiroslaw/kindle2anki"

  - title: "Languide"
    caption: "Aplikacja do nauki języków obcych."
    image: "portfolio/languide_small.png"
    type: "modal"
    description: "The web application for learning foreign languages. The application easily compares the texts from two languages sentence by sentence. This note could have tags and can be saved in a notebook. You can create a dictionary from select words. This app won't have translation option."
    features:
      - "Authentication a user"
      - "Comparing two texts"
      - "Creating notebook with user articles"
      - "Adding words to a dictionary"
      - "Managing user articles and notebooks"
      - "Saving to database"
    technology: "Spring Boot, Spring MVC, Spring Security, Java 8, Hibernate, H2 database, JUnit, Mockito, Project Lombok, thymeleaf, Bootstrap 4, wordnik API"
    repository: "https://github.com/amiroslaw/language"
    project: "https://languide.herokuapp.com"

  - title: "Investing CLI"
    caption: "Aplikacja CLI pozwalająca monitorować aktywa finansowe."
    image: "portfolio/investing-small.png"
    type: "modal"
    description: "The terminal application for tracking financial assets. Motivation for making this application was to try the new java features (java 16), graalVM and fluent process and the framework picocli. The program supports cryptocurrencies and stock market assets from the YahooFinanceAPI (some Crypto - Crypto trade data are not accessible)."
    features:
      - "tracking financial assets"
      - "creating a portfolio with holdings"
      - "calculating profit"
      - "adding alerts"
      - "support cryptocurrency and GPW"
    technology: "Java 16, graalVM, jsoup, picocli, unirest java, fluent process."
    repository: "https://github.com/amiroslaw/investing-cli"

  - title: "ePortfel"
    caption: "Elektroniczny portfel do zarządzania budżetem domowym."
    image: "portfolio/chart_eportfel_small.png"
    type: "modal"
    description: "The electronic wallet was created using javaFX technology. Use it to manage your personal accounts. The application implements a Double-entry bookkeeping system. The program is cross-platform software, built in Java 8."
    features:
      - "creating a wallet"
      - "creating a user profile"
      - "logging in to a user profile"
      - "managing wallets"
      - "saving in to a database"
      - "creating reports"
    technology: "Java 8, JavaFX, Scene Builder, SQLite, JDBC. The application was written in MVC pattern."
    repository: "https://github.com/amiroslaw/ePortfel"

  - title: "Gamification for Android"
    caption: "Aplikacja motywacyjna, która używa metody grywalizacji."
    image: "portfolio/android_small.jpg"
    type: "modal"
    description: "The motivational application uses the gamification method. The program was written in Android."
    features:
      - "creating a deck of cards"
      - "managing decks"
      - "saving to database"
      - "editing cards"
      - "help"
    technology: "SQLite, ORMLite, butterknife, junit, espresso test, picasso. The application was written in the MVP pattern."
    repository: "https://github.com/amiroslaw/Gamification-android"

  - title: "Grywalizacja"
    caption: "Aplikacja motywacyjna. Wersja na komputery stacjonarne."
    image: "portfolio/draw_grywalizacja_small.png"
    type: "modal"
    description: "The motivational application uses the gamification method. The program was written in Java 8 and JavaFX technology."
    features:
      - "creating a deck of cards"
      - "editing cards"
      - "managing decks"
      - "saving to database"
    technology: "Java 8, JavaFX, Scene Builder, SQLite, ORMLite, JDBC, The application was written in the MVC pattern."
    repository: "https://github.com/amiroslaw/grywalizacja"

