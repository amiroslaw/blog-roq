name: Roq Site Deploy

on:
  push:
    branches: [ master ]    # Switch to the branch which should be deployed to GitHub Pages
  schedule:
    - cron: "0 5 * * *"  # Runs every day at 05:00 UTC to publish scheduled content
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for the git dates of the sitemap <lastmod>
      # Add this step to ensure Java 25 is installed and active on the runner
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # Or your preferred JDK distribution
          java-version: '25'
          cache: 'maven'

      - name: Generate Roq Site
        uses: quarkiverse/quarkus-roq@v1.1
        with:
          java-version: '25'                            # Must match maven.compiler.release in pom.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}    # Used to automatically get the GitHub Pages url

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
