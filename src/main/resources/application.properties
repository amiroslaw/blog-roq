quarkus.qute.alt-expr-syntax=true

# --- Site -------------------------------------------------------------------
site.url=https://miroslaw.ovh
site.default-locale=pl
site.date-format=yyyy-MM-dd

# --- AsciiDoc ---------------------------------------------------------------
# Highlight code blocks with highlight.js (bundled from mvnpm, see web/syntax.js)
quarkus.asciidoc.attributes.source-highlighter=highlight.js
quarkus.asciidoc.attributes.icons=font
quarkus.asciidoc.attributes.experimental=true

# --- Diagram (Kroki) --------------------------------------------------------
# Use the public Kroki server (setting the url disables the docker dev-service)
# quarkus.rest-client.kroki-api.url=https://kroki.io

# --- OG Card ----------------------------------------------------------------
quarkus.roq.plugin.og-card.collections=posts
quarkus.roq.plugin.og-card.include-paths=/about/
quarkus.roq.plugin.og-card.site-name=Mirosław
quarkus.roq.plugin.og-card.skip-if-image-set=false

quarkus.roq.faker.count.posts=2

# dev 
# allows to view page on the mobile, but breaks editor
quarkus.http.host=0.0.0.0
